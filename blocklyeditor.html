    // Helpers for XML export/import using Blockly's XML API
    function exportWorkspaceXml(download=false) {
      const xmlDom = Blockly.Xml.workspaceToDom(workspace);
      const xmlText = Blockly.Xml.domToPrettyText(xmlDom);
      document.getElementById('xmlOutput').value = xmlText;
      if (download) {
        const blob = new Blob([xmlText], {type: 'application/xml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'workspace.xml';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }
    }

    function importWorkspaceXml() {
      const xmlText = document.getElementById('xmlOutput').value.trim();
      if (!xmlText) {
        alert('Paste XML into the textarea first or use the sample XML.');
        return;
      }
      try {
        const xmlDom = Blockly.Xml.textToDom(xmlText);
        workspace.clear();
        Blockly.Xml.domToWorkspace(xmlDom, workspace);
      } catch (e) {
        alert('Invalid XML: ' + e);
      }
    }

    function clearWorkspace() {
      workspace.clear();
      document.getElementById('xmlOutput').value = '';
    }

    // Buttons
    document.getElementById('exportBtn').addEventListener('click', () => {
      exportWorkspaceXml(false);
    });
    document.getElementById('importBtn').addEventListener('click', importWorkspaceXml);
    document.getElementById('clearBtn').addEventListener('click', clearWorkspace);

    // Optional: load a small starter block program on first load

    const starterDom = Blockly.Xml.textToDom(starterXml);
    Blockly.Xml.domToWorkspace(starterDom, workspace);
  </script>
